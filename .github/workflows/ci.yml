name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel an older run of the same branch when a new commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (exact versions from package-lock.json)
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Check the build output
        run: |
          test -f build/index.html
          test -f build/sitemap.xml
          test -f build/robots.txt
          test -f build/404.html
          test "$(ls -d build/work/*/ | wc -l)" -ge 1
          echo "Build output looks complete."

      - name: Upload build (for review or manual deploy)
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: build
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check production dependencies for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high
